spring:
  config:
    activate:
      on-profile: dev

# 数据库连接（请替换为你的真实信息或使用环境变量）
  datasource:
    url: jdbc:mysql://localhost:3306/tiktok?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

# MyBatis 配置（可选）
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.tiktok.*.entity

# 禁用 devtools 的自动重启，避免编辑器/资源变更触发多次重启导致 Maven 插件异常退出
  devtools:
    restart:
      enabled: false
