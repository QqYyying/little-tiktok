#   # 默认激活 dev 配置（可按需修改或在运行时覆盖）
#   profiles:
#     active: dev

spring:
  profiles:
    active: dev # 👈 激活开发环境

app:
  jwt:
    secret: "minitiktok_dev_secret_key_should_be_at_least_32_chars"
    expire-seconds: 7200
    issuer: "little-tiktok"
  monitor:
    slow-threshold-ms: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: little-tiktok
    description: API big homework mini tiktok backend
    version: 1.0.0
