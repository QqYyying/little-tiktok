spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB

app:
  jwt:
    secret: "minitiktok_dev_secret_key_should_be_at_least_32_chars"
    expire-seconds: 7200
    issuer: "little-tiktok"
  monitor:
    slow-threshold-ms: 500
  storage:
    type: s3
    local:
      base-dir: uploads
      public-base-url: /uploads
    s3:
      endpoint: http://127.0.0.1:9000
      access-key: root
      secret-key: 12345678
      bucket: ltt
      public-base-url: http://127.0.0.1:9000/ltt

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: little-tiktok
    description: API big homework mini tiktok backend
    version: 1.0.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.tiktok
  paths-to-match:
    - /api/**
    - /actuator/health
    - /actuator/info
    - /actuator/prometheus
